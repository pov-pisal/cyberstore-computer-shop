{% extends 'base.html' %}

{% block title %}Login | CYBERSTORE Computer Shop{% endblock %}

{% block content %}
<div class="glass-card auth-layout">
    <div class="auth-header">
        <h1>Login to <span>CYBERSTORE</span></h1>
        <p>Access your billing details, order history, and shopping cart.</p>
    </div>
    
    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        
        <div class="form-group" style="margin-bottom: 20px;">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-input" required>
        </div>
        
        <div class="form-group" style="margin-bottom: 24px;">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" class="form-input" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 15px;">
            Sign In
        </button>
    </form>
    
    <div class="auth-footer">
        Don't have an account? <a href="{% url 'register' %}">Create Account</a>
    </div>
</div>
{% endblock %}
