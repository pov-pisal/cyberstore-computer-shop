version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: computer_shop_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=computer_shop
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d computer_shop"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: computer_shop_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-key-for-development-computer-shop-app-123
      - DEBUG=True
      - DATABASE_URL=postgres://postgres:postgres@db:5432/computer_shop
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
